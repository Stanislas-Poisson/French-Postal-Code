name: Watch sources

# Every day, compare the sources (INSEE COG, La Poste) with the time of the last generation of the dataset.
# When one is newer, open an issue that says so and start the workflow `Build dataset`, which publishes the new
# version by itself when the data changed (a minor release), or proposes a draft to review (see docs/release.md).
#
# The points of the BAN move without any of these files changing: every Monday (or with `force`), the build is
# started even when no source is newer, and may publish a patch release. The other days, a patch change waits.
#
# A draft waits for the maintainer: it blocks the builds, and a notification reminds of it every day.
on:
  schedule:
    - cron: '30 5 * * *'
  workflow_dispatch:
    inputs:
      since:
        description: 'A date (YYYY-MM-DD) to use instead of the last generation, to try the check'
        required: false
      force:
        description: 'Start the build even if no source is newer (the weekly control of the BAN)'
        type: boolean
        default: false

permissions:
  contents: write
  issues: write
  actions: write

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Compare the sources with the last generation
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          SINCE: ${{ inputs.since }}
        run: python3 .github/scripts/check_sources.py

      - name: Open or update the issue
        if: steps.check.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REASONS: ${{ steps.check.outputs.reasons }}
          LAST: ${{ steps.check.outputs.last_generated }}
        run: |
          gh label create data-update --description "A source of the dataset changed" --color 0e8a16 --force
          {
            echo "A source of the dataset is newer than the last generation (${LAST}):"
            echo
            echo "${REASONS}"
            echo
            echo "The workflow \`Build dataset\` builds the new version and proposes it as a draft release: review it and publish it (see [docs/release.md](docs/release.md))."
            echo "To build by hand instead: \`make build-dataset\`, check \`make status\`, then follow the same document."
            echo "This issue is updated every day until a release is made, and can then be closed."
          } > body.md
          number=$(gh issue list --label data-update --state open --json number --jq '.[0].number // empty')
          if [ -n "${number}" ]; then
            gh issue edit "${number}" --body-file body.md
          else
            gh issue create --title "A source of the dataset changed: build a new version" --body-file body.md --label data-update --assignee Stanislas-Poisson
          fi

      - name: Remind of the drafts to review
        if: inputs.since == ''
        env:
          GH_TOKEN: ${{ github.token }}
          NTFY_URL: ${{ secrets.NTFY_URL }}
        run: |
          gh release list --limit 50 --json tagName,isDraft,createdAt \
            --jq '.[] | select(.isDraft) | "\(.tagName) \(.createdAt)"' | while read -r tag created; do
            days=$(( ($(date -u +%s) - $(date -u -d "${created}" +%s)) / 86400 ))
            echo "The draft ${tag} waits for a review since ${days} day(s)."
            curl -fsS -m 15 -H "Title: French-Postal-Code ${tag} waits for a review" -H "Priority: high" \
              -d "The draft has waited ${days} day(s) and blocks the new builds: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases" \
              "${NTFY_URL}" > /dev/null || echo "The ntfy reminder could not be sent."
          done

      - name: Start the build
        if: inputs.since == ''
        env:
          GH_TOKEN: ${{ github.token }}
          CHANGED: ${{ steps.check.outputs.changed }}
          REASONS: ${{ steps.check.outputs.reasons }}
          FORCE: ${{ inputs.force }}
        run: |
          fingerprint=""
          control=false
          if [ "$(date -u +%u)" = "1" ] || [ "${FORCE}" = "true" ]; then
            control=true
          fi
          if [ "${CHANGED}" = "true" ]; then
            # The same sources are built once: a build that finds nothing to release leaves a marker in the issue.
            # The weekly control builds them again, because a patch release is published on that day.
            fingerprint=$(printf '%s' "${REASONS}" | sha256sum | cut -c1-16)
            number=$(gh issue list --label data-update --state open --json number --jq '.[0].number // empty')
            if [ "${control}" != "true" ] && [ -n "${number}" ] && gh issue view "${number}" --json comments --jq '.comments[].body' | grep -q "build-checked:${fingerprint}"; then
              echo "These sources were already built: nothing to release before the weekly control."
              exit 0
            fi
          elif [ "${control}" = "true" ]; then
            echo "Weekly control of the BAN: build even though no source is newer."
          else
            echo "No source is newer, and it is not the day of the control of the BAN."
            exit 0
          fi

          # One build at a time, and none while a draft release waits for the review of the maintainer.
          drafts=$(gh release list --limit 50 --json isDraft --jq 'map(select(.isDraft)) | length')
          running=$(gh run list --workflow build-dataset.yml --json status --jq 'map(select(.status != "completed")) | length')
          if [ "${drafts}" != "0" ] || [ "${running}" != "0" ]; then
            echo "A draft release exists or a build is running: no new build."
            exit 0
          fi

          args=(-f dry_run=false)
          if [ "${control}" = "true" ]; then
            args+=(-f publish_patch=true)
          fi
          if [ -n "${fingerprint}" ]; then
            args+=(-f fingerprint="${fingerprint}")
          fi
          gh workflow run build-dataset.yml "${args[@]}"
